# music-trainer.app: front page at /, the three apps under their own paths.
# HTTPS: sudo certbot --nginx -d music-trainer.app -d www.music-trainer.app

server {
    listen 80;
    listen [::]:80;
    server_name music-trainer.app www.music-trainer.app;

    root /var/www/html/music-trainer.app;
    index index.html;

    add_header Cache-Control "no-cache";

    # /chordtrainer/ -> /var/www/html/megacorp1.eu/chordtrainer/ etc.
    location ~ ^/(chordtrainer|counterpointer|dicteeineer|harmoneer)(/|$) {
        root /var/www/html/megacorp1.eu;

        location ~ /samples/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
