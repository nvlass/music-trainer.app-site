# music-trainer.app: front page at /, the three apps under their own paths.
# Install: /etc/nginx/sites-available/music-trainer.app, symlink into sites-enabled, `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name music-trainer.app www.music-trainer.app;

    location /.well-known/acme-challenge/ { root /var/www/html/music-trainer.app; }
    location / { return 301 https://music-trainer.app$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.music-trainer.app;

    ssl_certificate     /etc/letsencrypt/live/music-trainer.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music-trainer.app/privkey.pem;

    return 301 https://music-trainer.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music-trainer.app;

    ssl_certificate     /etc/letsencrypt/live/music-trainer.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music-trainer.app/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Front page (this repo).
    root /var/www/html/music-trainer.app;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /img/ { add_header Cache-Control "public, max-age=86400"; }

    # The apps. URLs map onto the existing folders: /chordtrainer/ -> /var/www/html/megacorp1.eu/chordtrainer/.
    # They use relative paths, so each app's service worker is scoped to its own folder.
    location ~ ^/(chordtrainer|counterpointer|dicteeineer)$ {
        return 301 /$1/;
    }

    location ~ ^/(chordtrainer|counterpointer|dicteeineer)/ {
        root /var/www/html/megacorp1.eu;
        try_files $uri $uri/ =404;

        # Network-first app shell: these must never be cached by the browser, or deploys don't show up.
        location ~ /(sw\.js|index\.html)$ { add_header Cache-Control "no-cache"; }
        location ~ /js/                  { add_header Cache-Control "no-cache"; }
        location ~ /samples/             { add_header Cache-Control "public, max-age=31536000, immutable"; }
    }
}
